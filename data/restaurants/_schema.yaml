# Restaurant YAML Schema Reference
# Each restaurant is a single YAML file in a district folder.
# Filename convention: {id}.yaml (id must be unique across all districts)
#
# Directory structure:
#   data/restaurants/{district}/{id}.yaml
#
# Example: data/restaurants/mitte/sichuan-folk.yaml

# --- Required fields ---
name:
  en: "English Name"
  zh: "中文名"
  de: "German Name"            # optional

# tags: 1~3 entries. First entry is the "primary" tag (used as the default
# selection on the home filter). Two families, all flat in the same array:
#   Regional (cuisine)  — 0~1 expected
#     SICHUAN | CANTONESE | NORTHERN | NORTHEASTERN |
#     SHANGHAINESE | HUNAN | XINJIANG | TAIWANESE | MUSLIM
#   Format (what they serve / how it's eaten) — 1~2 expected
#     HOTPOT | BBQ | NOODLES | DUMPLINGS | DIM_SUM | MALATANG |
#     VEGETARIAN | BREAKFAST | TEA_HOUSE | BAKERY | STREET_FOOD | FUSION
tags:
  - SICHUAN
  - NOODLES

address:
  addressLine1: "Street 123"
  addressLine2: ""             # optional
  note: ""                     # optional
  postalCode: "10115"
  district: "Mitte"            # must match the folder name (display form)
  city: "Berlin"               # default: Berlin
  country: "Germany"           # default: Germany

latitude: 52.520008
longitude: 13.404954

# --- Optional fields ---
phone: "+49 30 12345678"
priceRange: "€€"              # €, €€, €€€
description:
  en: "English description"
  zh: "中文描述"
  de: "German description"     # optional
logoUrl: "https://example.com/logo.png"
galleries:
  - "https://example.com/photo1.jpg"
  - "https://example.com/photo2.jpg"
hidden: false                  # true = soft-deleted, hidden from public

# --- Editorial / curation ---
# featured + editorialNote come from the community-curated "柏林慢慢游甄选20"
# selection. featured drives a badge in the app and a featured row on the
# landing page. editorialNote is a short hand-written hook (Chinese), shown
# under the cover image on the detail sheet.
featured: false

# Pinwo partner discount/coupon flag. Drives the discount-marker variant on
# the map and (eventually) a perks surface in the detail sheet. Independent
# from `featured`; a restaurant can be one, both, or neither.
hasDiscount: false

editorialNote:
  zh: "广式点心｜凌晨营业｜宵夜江湖"
  en: ""                        # optional, leave empty until translated

# --- Chain / brand ---
# When multiple branches share an operator, set the same `brand` on every
# branch. The app groups them under a single brand profile and exposes
# "other branches" navigation in the detail sheet.
chain:
  brand: "Wen Cheng"
  branch: "Charlottenburg"

# --- Google Places enrichment (optional) ---
# When set, the sync pipeline pulls live data from Google Places (rating,
# weekly hours, website, deep link). Find the placeId at:
#   https://developers.google.com/maps/documentation/places/web-service/place-id
# The pipeline caches results for 7 days; bump _placeRefreshedAt to force re-fetch.
placeId: "ChIJN1t_tDeuEmsRUsoyG83frY4"
