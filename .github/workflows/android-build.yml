name: Android Build

on:
  push:
    branches: ['*']
    # App build only — skip pushes that touch only docs, data, web apps, or
    # the data pipeline. Tag-mirror drift is gated separately (tag-check.yml).
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/check-string-escapes.sh'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Fast fail before the slow build: Compose renders \' / \" literally,
      # so a stray escape in strings.xml would ship a visible backslash.
      - name: Lint string resources
        run: bash scripts/check-string-escapes.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gate the build on tests: pure-logic tests (commonTest) plus the
      # Robolectric Compose UI tests both run on the JVM here — no emulator,
      # no secrets, no keystore needed.
      - name: Run unit + UI tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: composeApp/build/reports/tests/testDebugUnitTest/

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: composeApp/build/outputs/apk/release/*.apk
