name: Update Contributors

on:
  push:
    branches: [main]
    paths:
      - "data/restaurants/**"
      - "scripts/generate-contributors/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Skip the auto-commit this workflow itself produces, to avoid loops.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # Regenerate from the current tip of main, which includes any merge
          # that landed after the one that triggered this run.
          ref: main
          # Need full history to scan all commits touching data/restaurants/.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate Contributors.kt
        run: node scripts/generate-contributors/index.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain composeApp/src/commonMain/kotlin/com/novawerk/berlinfoodmap/ui/pages/settings/Contributors.kt)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src/commonMain/kotlin/com/novawerk/berlinfoodmap/ui/pages/settings/Contributors.kt
          git commit -m "chore(contributors): refresh from data/restaurants git history"
          # main can move under us: another merge, or bump-version
          # pushing at the same time. Rebase onto it and retry rather than
          # fail — never force-push.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (main moved), rebasing — attempt $attempt/3"
            git pull --rebase origin main
          done
          exit 1
